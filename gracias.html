<!DOCTYPE html>
<html lang="es-CL">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="5;url=https://evolvesolutions.cl/">
  <title>Gracias por contactarnos | Evolve Solutions</title>
  <meta name="description" content="Hemos recibido tu mensaje. Gracias por contactar a Evolve Solutions.">
  <link href="/assets/img/logos/favicon-google.png" rel="icon" type="image/png" sizes="1254x1254">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --background: #070708;
      --surface: #1f1f23;
      --text: rgba(255, 255, 255, 0.82);
      --heading: #ffffff;
      --blue: #087bff;
      --cyan: #00dce6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(8, 123, 255, 0.18), transparent 45%),
        var(--background);
      font-family: "Inter", sans-serif;
    }

    .thank-you-card {
      width: min(100%, 720px);
      padding: clamp(32px, 6vw, 64px);
      border: 1px solid rgba(8, 123, 255, 0.42);
      border-radius: 24px;
      background: rgba(31, 31, 35, 0.92);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.38);
      text-align: center;
    }

    .brand {
      width: min(100%, 360px);
      height: auto;
      margin-bottom: 32px;
    }

    .confirmation-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      font-size: 34px;
      box-shadow: 0 12px 30px rgba(8, 123, 255, 0.35);
    }

    h1 {
      margin: 0 0 18px;
      color: var(--heading);
      font-family: "Montserrat", sans-serif;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.12;
    }

    p {
      margin: 0 auto;
      max-width: 560px;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .redirect-message { margin-top: 24px; }

    .home-link {
      display: inline-flex;
      margin-top: 28px;
      padding: 13px 24px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover { background: #006be0; }
  </style>
</head>

<body>
  <main class="thank-you-card">
    <img src="assets/img/logos/logo_sin_slogan.png" class="brand" alt="Evolve Solutions">
    <div class="confirmation-icon" aria-hidden="true"><i class="bi bi-check-lg"></i></div>
    <h1>¡Gracias por escribirnos!</h1>
    <p>Hemos recibido tu mensaje correctamente. Revisaremos la información y nos pondremos en contacto contigo a la brevedad.</p>
    <p class="redirect-message">Volverás al inicio en <strong id="countdown">5</strong> segundos.</p>
    <a href="https://evolvesolutions.cl/" class="home-link">Volver ahora</a>
  </main>

  <script>
    (() => {
      const countdown = document.querySelector('#countdown');
      let seconds = 5;

      const timer = window.setInterval(() => {
        seconds -= 1;
        countdown.textContent = seconds;

        if (seconds <= 0) {
          window.clearInterval(timer);
          window.location.replace('https://evolvesolutions.cl/');
        }
      }, 1000);
    })();
  </script>
</body>

</html>
